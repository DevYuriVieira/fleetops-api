services:
  fleetops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetops-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fleetops};Username=${POSTGRES_USER:-fleetops_dev};Password=${POSTGRES_PASSWORD:-fleetops_dev_secret}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      Jwt__SecretKey: ${JWT_SECRET:-FleetOps_Super_Secret_Jwt_Signing_Key_2026_Minimum_256_Bits!}
      Jwt__Issuer: FleetOps.Api
      Jwt__Audience: FleetOps.Clients
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fleetops-network

  postgres:
    image: postgres:18-alpine
    container_name: fleetops-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetops}
      POSTGRES_USER: ${POSTGRES_USER:-fleetops_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetops_dev_secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetops_dev} -d ${POSTGRES_DB:-fleetops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fleetops-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fleetops-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fleetops-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fleetops-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OpenTelemetry Protocol (OTLP) gRPC
      - "4318:4318"   # OpenTelemetry Protocol (OTLP) HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - fleetops-network

volumes:
  postgres-data:
    name: fleetops-postgres-data
  rabbitmq-data:
    name: fleetops-rabbitmq-data

networks:
  fleetops-network:
    name: fleetops-network
    driver: bridge

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Ubuntu / Real Infra)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fleetops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Disable Runner Host PostgreSQL
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl disable postgresql || true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Automated Tests
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=fleetops_test;Username=postgres;Password=postgres;"
          POSTGRES_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=fleetops_test;Username=postgres;Password=postgres;"
          FLEETOPS_TEST_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=fleetops_test;Username=postgres;Password=postgres;"
          FLEETOPS_RABBITMQ_HOST: "127.0.0.1"
          FLEETOPS_RABBITMQ_PORT: "5672"
          RabbitMQ__Host: "127.0.0.1"
          RabbitMQ__Port: "5672"
          Jwt__SecretKey: "FleetOps_Super_Secret_Jwt_Signing_Key_2026_Minimum_256_Bits!"
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: dotnet test --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Annotate Test Failures
        if: failure()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob
          for f in glob.glob('**/test_results.trx', recursive=True):
              tree = ET.parse(f)
              for r in tree.findall('.//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult'):
                  if r.attrib.get('outcome') == 'Failed':
                      name = r.attrib.get('testName')
                      msg = ''
                      for o in r.findall('.//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}Message'):
                          msg += (o.text or '') + ' '
                      for s in r.findall('.//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}StackTrace'):
                          msg += (s.text or '') + ' '
                      print(f'::error title={name}::{msg.strip()[:500]}')
          "

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Ubuntu / Real Infra)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fleetops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Automated Tests
        env:
          FLEETOPS_TEST_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=fleetops_test;Username=postgres;Password=postgres;"
          FLEETOPS_RABBITMQ_HOST: "127.0.0.1"
          FLEETOPS_RABBITMQ_PORT: "5672"
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: dotnet test --no-restore --configuration Release --verbosity normal

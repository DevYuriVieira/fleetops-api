name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Benchmark suite to execute (Health, Domain, Stress, RateLimit, All)'
        required: true
        default: 'Domain'
        type: choice
        options:
          - Health
          - Domain
          - Stress
          - RateLimit
          - All
  schedule:
    # Run weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

jobs:
  performance-benchmark:
    name: Execute k6 Performance & Capacity Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fleetops_bench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Disable Runner Host PostgreSQL
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl disable postgresql || true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install k6
        run: |
          sudo gpg -k || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Restore Dependencies & Build API
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release src/FleetOps.Api

      - name: Apply Database Migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=fleetops_bench;Username=postgres;Password=postgres;"
        run: |
          dotnet run --project src/FleetOps.Api --configuration Release -- --migrate-only || dotnet test tests/FleetOps.IntegrationTests --filter "FullyQualifiedName~Persistence" --configuration Release

      - name: Start FleetOps API (Capacity Profile)
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=fleetops_bench;Username=postgres;Password=postgres;"
          RabbitMQ__Host: "127.0.0.1"
          RabbitMQ__Port: "5672"
          Jwt__SecretKey: "FleetOps_Super_Secret_Jwt_Signing_Key_2026_Minimum_256_Bits!"
          RateLimiting__PermitLimit: "10000"
          RateLimiting__WindowSeconds: "60"
        run: |
          nohup dotnet run --project src/FleetOps.Api --configuration Release --urls "http://127.0.0.1:5000" > api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          sleep 5

      - name: Verify API Health
        run: |
          curl -f http://127.0.0.1:5000/health/ready || (cat api.log && exit 1)

      - name: Run k6 Benchmarks
        env:
          SELECTED_SUITE: ${{ github.event.inputs.suite || 'Domain' }}
        shell: pwsh
        run: |
          ./load-tests/run-benchmarks.ps1 -BaseUrl "http://127.0.0.1:5000" -K6Path "k6" -Suite $env:SELECTED_SUITE

      - name: Upload API Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-benchmark-log
          path: api.log
